[pytest]
# Collect only the tests/ entry point. tests/ holds the toolkit tests (core/)
# plus one shim per corpus (e.g. test_hs3.py) that re-exports the corpus's own
# test definitions from corpora/<name>/tests/. Pinning testpaths here keeps
# pytest from ALSO walking corpora/ directly, which would collect every corpus
# test twice (once directly, once via its shim).
testpaths = tests
