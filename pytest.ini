[pytest]
# Collect only the tests/ entry point: tests/core/ (toolkit tests), a few
# converter-internals unit tests, and test_unified.py -- the unified
# per-test-directory harness, which itself discovers every corpora/**/test.json
# dir at collection time (see unified/loader.py::discover_test_dirs). Each
# test dir's own test.py is an oracle module (oracle()/grad_oracle()/stat()),
# loaded dynamically by the harness, not a pytest test module.
testpaths = tests
markers =
    stablehlo_only: unified harness case whose engine is stablehlo (used by `pixi run -e stablehlo unified` to skip the det-js cases already covered by `pixi run test`)
    provenance: the frozen table's engine commit vs the engine actually running -- METADATA SKEW, not a number, so it is deselected below and reported by `pixi run provenance` instead of failing a run

# Provenance is deselected from the default run ON PURPOSE. Both engines move
# under this harness continuously, so a table pinned behind them is the normal
# state, and failing on it made every unrelated engine merge red on metadata
# while saying nothing about a value. What blocks is the VERDICT comparison,
# which is a number. `pixi run provenance` reports the skew; a command-line -m
# overrides this one, so `-m provenance` and `-m stablehlo_only` both still work.
addopts = -m "not provenance"
