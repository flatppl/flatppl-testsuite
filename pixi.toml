[workspace]
name = "flatppl-testsuite"
version = "0.0.0"
description = "Test FlatPPL engines against corpora of converted foreign models (HS3 is the first corpus)."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# ---------------------------------------------------------------------------
# Base environment: the Python runner, the rust converter toolchain, and Node
# for the JS scorer. The JS engine itself is resolved from a flatppl-js checkout
# (FLATPPL_JS_DIR, default ../flatppl-js) rather than a package dependency.
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.11"
# Node 24 specifically: the scorer consumes flatppl-js's raw .ts via runtime
# type-stripping, which needs Node >=24.
nodejs = "24.*"
# rust provides cargo, used to install the flatppl CLI from git at a pinned rev.
rust = ">=1.96"
# INDEPENDENT oracle for the det-js corpora's test.py::oracle()/regen.py
# offline path (closed-form Normal/mixture/truncation/log-normal densities,
# etc.) — never the sibling engine.
scipy = ">=1.11"
polars = ">=1.43.2,<2"

[pypi-dependencies]
pytest = ">=8"

[activation.env]
# The flatppl CLI is installed here by `pixi run setup`; src/ holds the package;
# the JS engine is resolved from a sibling flatppl-js checkout by default, but
# an inherited FLATPPL_JS_DIR wins (e.g. `FLATPPL_JS_DIR=… pixi run …` to point
# at a worktree / alternate engine build) — the default only fills the unset case.
PATH = "$PIXI_PROJECT_ROOT/.pixi-bin/bin:$PATH"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
FLATPPL_JS_DIR = "${FLATPPL_JS_DIR:-$PIXI_PROJECT_ROOT/../flatppl-js}"

[tasks]
# One-time setup: install the pinned converter binary.
setup = { cmd = "bash scripts/setup.sh" }
# Run the whole test suite: tests/core/ (toolkit) + tests/test_unified.py (the
# unified per-test-directory harness, JS and det-js cases in this env -- see
# `unified` below for that alone).
# `python -m pytest` (not the bare `pytest` console script) is robust when the
# env exposes pytest as a module but not on PATH.
test = "python -m pytest -q"
# Convert one fixture (debugging aid): pixi run convert <hs3.json> <out.flatppl>
convert = ".pixi-bin/bin/flatppl convert --from hs3"
# The unified per-test-directory harness alone (every `corpora/**/test.json`
# dir, one case per (dir, engine) pair -- see tests/test_unified.py). In the
# base env this runs every JS and det-js case; run under `-e stablehlo` (with
# FLATPPL_BIN + PYTHONPATH=$PWD/src) for the stablehlo cases too.
unified = "python -m pytest tests/test_unified.py -q"
# The density oracle sweep's sized defect report, from the committed table
# (verdicts/density-sweep.json) -- no engine calls, just reads the file.
sweep = "python -m flatppl_testsuite.sweep.cli report"
# Regenerate that table from a live full-space sweep (needs FLATPPL_BIN +
# FLATPPL_JS_DIR). Slow -- see sweep/table.py's SLICE_DESCRIPTION for the
# faster CI-only slice `tests/sweep/test_gate.py` runs instead.
sweep-regen = "python -m flatppl_testsuite.sweep.cli regen --full"
# The SAMPLER sweep's sized report, from the committed table
# (verdicts/sampler-sweep.json) -- no engine calls, just reads the file.
sampler-sweep = "python -m flatppl_testsuite.sampler_sweep.cli report"
# The sampler roster itself (families x wraps x checks), no engine calls.
sampler-sweep-roster = "python -m flatppl_testsuite.sampler_sweep.cli roster"
# Regenerate the sampler table from a live run (needs FLATPPL_JS_DIR only --
# this sweep drives the JS sampler directly and never invokes the determiniser,
# so it needs no FLATPPL_BIN; see scoring/sampler_sweep.cjs's header for why).
# The whole 71-row roster takes ~12 s.
sampler-sweep-regen = "python -m flatppl_testsuite.sampler_sweep.cli regen"
# Move both sweeps' engine pins to the sibling engines' current commits, after
# a flatppl-js / flatppl-rust merge leaves a table frozen against an older one.
# Regenerates both tables and commits ONLY when no verdict moved -- see
# scripts/repin.py. Never pushes.
repin = "python scripts/repin.py"
# The two provenance checks, which pytest.ini deselects from `pixi run test`: a
# table pinned behind the engines is metadata skew, not a number, so it reports
# here instead of failing a run. Non-zero means skew; `pixi run repin` clears it.
provenance = "python -m pytest -m provenance -q"

# ---------------------------------------------------------------------------
# Oracle environments. ROOT and pyHS3 have disjoint heavy dependency stacks,
# kept in separate features so the base environment stays light.
# ---------------------------------------------------------------------------
# The ROOT oracle task lives on the feature, not the base env: it imports ROOT,
# so exposing it in the default env only invites `pixi run gen-conversions` to
# fail (or, before the merge fix, to appear to succeed while writing nothing the
# harness reads). Refresh the hs3 conversions' frozen 2DeltaNLL vectors with:
#   pixi run -e root gen-conversions
[feature.root.tasks]
gen-conversions = { cmd = "python corpora/hs3/conversions/gen_expected.py" }

[feature.root.dependencies]
root = ">=6.30"

[feature.pyhs3.pypi-dependencies]
pyhs3 = "*"

# The pyhf oracle for `corpora/pyhf/`. pyhf is the ONLY reference number for a
# pyhf workspace: the rust converter is the artifact under test and neither
# engine can stand in for it. Pinned to 0.7.6, the version the import audit
# measured, so a regenerated vector is comparable to the frozen one; `numpy`
# pins the 64-bit numpy backend the audit used.
#
# Isolated from the default env on purpose. `pixi run test` scores these
# fixtures with det-js and never imports pyhf, so CI needs no pyhf env — this
# feature exists only to regenerate the frozen vectors:
#   FLATPPL_BIN=/path/to/flatppl pixi run -e pyhf gen-pyhf
[feature.pyhf.dependencies]
python = ">=3.11"
numpy = ">=1.26,<2.1"
scipy = ">=1.11"

[feature.pyhf.pypi-dependencies]
pyhf = "==0.7.6"

[feature.pyhf.tasks]
# Freeze each `corpora/pyhf/<fixture>/test.json`'s absolute logpdf vector from
# pyhf. Needs FLATPPL_BIN: the record shape per parameter is read off the
# converter's own emitted `elementof` declaration, not guessed.
gen-pyhf = { cmd = "python corpora/pyhf/gen_expected.py" }
# Freeze each `corpora/pyhf-rejects/<doc>/test.json`'s converter exit code and
# refusal message, beside pyhf's own measured verdict on the same document.
gen-pyhf-rejects = { cmd = "python corpora/pyhf-rejects/gen_expected.py" }

# ---------------------------------------------------------------------------
# StableHLO numeric-execution gate. Executes emitted StableHLO with Enzyme-JAX
# (`enzyme_ad.jax.hlo_call`) so the emitted density modules are checked as
# NUMBERS and GRADIENTS, not just structurally. Keep the released Enzyme and
# JAX pair aligned: their MLIR parsers must agree on dense boolean encoding.
# Python 3.15 has binary Enzyme wheels on the supported CI/local platforms.
[feature.stablehlo.dependencies]
python = "3.15.*"
# Independent numerical oracles.
scipy = ">=1.11"
numpy = ">=2.0"
polars = ">=1.43.2,<2"

[feature.stablehlo.pypi-dependencies]
# enzyme_ad.jax.hlo_call imports emitted StableHLO (@main) as a jit-able +
# differentiable jax callable — the executor for value AND gradient checks.
# The FlatPPL Enzyme fork's alpha 13 wheels, pinned per platform below, support
# native matrix derivatives and preserve shared inputs and compact residuals.
# pixi 0.81 does not verify the #sha256 fragment. Check downloads against
# the release's SHA256SUMS.
jax = "==0.12.0.1"
jaxlib = "==0.12.0.1"
pytest = ">=8"

[feature.stablehlo.target.osx-arm64.pypi-dependencies]
enzyme-ad = { url = "https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp315-cp315-macosx_14_0_arm64.whl#sha256=005e80f52bbcde3dbe063c00f1b95d8f1f7a559bfaf8822a78a192b5595c68ec" }

[feature.stablehlo.target.linux-64.pypi-dependencies]
enzyme-ad = { url = "https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp315-cp315-manylinux_2_35_x86_64.whl#sha256=4fdd2fadcacf11157cb48d5b17b001b7af8161b4b6da1a0d1b7034dd39a93d85" }

# The stablehlo-feature tasks live here (the `stablehlo` env is
# no-default-feature, so the base `[tasks]` are not in scope). Point
# FLATPPL_BIN at a `flatppl` built with the `stablehlo` feature (the
# subcommand is feature-gated).
[feature.stablehlo.tasks]
# Regenerate a unified test dir's frozen `expected` from its test.py oracle:
#   pixi run -e stablehlo regen corpora/stablehlo/linear_regression
regen = "python -m flatppl_testsuite.unified.regen"
# The unified harness's stablehlo cases (every `corpora/**/test.json` dir
# listing "stablehlo" among its engines), executed via Enzyme-JAX:
#   FLATPPL_BIN=/path/to/target/release/flatppl PYTHONPATH=$PWD/src \
#     pixi run -e stablehlo unified
# `-m stablehlo_only` scopes collection to the stablehlo cases: this env has
# no `nodejs` dependency of its own, so without the filter it also re-runs
# every det-js case here against whatever unpinned system Node is on PATH --
# pure duplicate work already covered, correctly, by `pixi run test`.
unified = "python -m pytest tests/test_unified.py tests/test_stablehlo_reuse.py tests/test_stablehlo_execution.py tests/test_metrics.py tests/test_splines.py tests/test_positive_count_normalization.py tests/test_broadcast_reductions.py tests/test_broadcast_sharing.py tests/test_constant_branches.py tests/test_poisson_precision.py tests/test_poisson_sampling.py tests/test_rowwise_sampling.py tests/test_lkj_sampling.py tests/test_multinomial_sampling.py tests/test_dirichlet_sampling.py tests/test_small_shape_gammas.py tests/test_ksuperpose_sampling.py tests/test_mixture_families.py tests/test_interval_masses.py tests/test_locscale_truncation.py tests/test_interval_inputs.py tests/test_runtime_infinite_bounds.py tests/test_scalar_logvolume.py tests/test_kernel_pushforward.py tests/test_scalar_affine_pushforward.py tests/test_vector_shift_pushforward.py tests/test_von_mises.py tests/test_iid_shapes.py tests/test_transposed_scaling.py tests/test_product_mixtures.py tests/test_fill_arrays.py tests/test_negative_binomial2_broadcast.py tests/test_fixed_filter.py tests/test_categorical_rows.py tests/test_matrix_pushforward.py tests/test_dependent_prior_bounds.py tests/test_mixed_measure_density.py tests/test_exponential_tilt.py tests/test_segment_sums.py tests/test_input_vectors.py tests/test_interpolation.py tests/test_pyhf_helpers.py tests/test_hep_elementary_distributions.py tests/test_pyhf_yields.py tests/test_regression_reference.py tests/test_formula_distributional_scale.py tests/test_posteriordb.py tests/test_bundles.py -q -m stablehlo_only"

# ---------------------------------------------------------------------------
# Black-box row: a BridgeStan box served by flatppl-bridge, queried from FlatPPL
# through flatppl-python (tests/test_bridge_box.py). `bridge-setup` builds
# flatppl-python and flatppl-bridge from sibling checkouts (FLATPPL_PYTHON_DIR,
# FLATPPL_BRIDGE_DIR) and the Stan model; BridgeStan needs a C++17 compiler.
#   pixi run -e bridge bridge-setup && pixi run -e bridge bridge
[feature.bridge.dependencies]
python = "3.12.*"
scipy = ">=1.11"
numpy = ">=2.0"
pyarrow = ">=25"
pip = "*"
maturin = ">=1.9,<2"
rust = ">=1.96"

[feature.bridge.pypi-dependencies]
jax = "==0.12.0.1"
jaxlib = "==0.12.0.1"
pytest = ">=8"
bridgestan = "==2.9.0"

[feature.bridge.target.osx-arm64.pypi-dependencies]
enzyme-ad = { url = "https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp312-cp312-macosx_14_0_arm64.whl#sha256=db6bae9ca57cf9668fc73c41bd90afc81912e8066a1bab7014c8fdf0bd4750cb" }

[feature.bridge.target.linux-64.pypi-dependencies]
enzyme-ad = { url = "https://github.com/BJMCox/Enzyme-JAX/releases/download/flatppl-alpha.13/enzyme_ad-0.0.15%2Bflatppl.13-cp312-cp312-manylinux_2_35_x86_64.whl#sha256=78b737445fa5e8d31297de35aae7f272d6a237daae5b7452f4d8d2510f2c9bb2" }

[feature.bridge.tasks]
bridge-setup = "bash scripts/setup_bridge.sh"
bridge = "python -m pytest tests/test_bridge_box.py -q -m bridge_only"

[environments]
root = ["root"]
pyhs3 = ["pyhs3"]
# no-default-feature: the oracle must not be able to reach the runner's own
# scoring path, so a frozen number cannot come from the engine under test.
pyhf = { features = ["pyhf"], no-default-feature = true }
stablehlo = { features = ["stablehlo"], no-default-feature = true }
bridge = { features = ["bridge"], no-default-feature = true }
