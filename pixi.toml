[workspace]
name = "flatppl-testsuite"
version = "0.0.0"
description = "Test FlatPPL engines against corpora of converted foreign models (HS3 is the first corpus)."
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

# ---------------------------------------------------------------------------
# Base environment: the Python runner, the rust converter toolchain, and Node
# for the JS scorer. The JS engine itself is resolved from a flatppl-js checkout
# (FLATPPL_JS_DIR, default ../flatppl-js) rather than a package dependency.
# ---------------------------------------------------------------------------
[dependencies]
python = ">=3.11"
# Node 24 specifically: the scorer consumes flatppl-js's raw .ts via runtime
# type-stripping, which needs Node >=24.
nodejs = "24.*"
# rust provides cargo, used to install the flatppl CLI from git at a pinned rev.
rust = ">=1.75"
# INDEPENDENT oracle for corpora/fragment/gen_expected.py (closed-form
# Normal/mixture/truncation/log-normal densities) — never the sibling engine.
scipy = ">=1.11"

[pypi-dependencies]
pytest = ">=8"

[activation.env]
# The flatppl CLI is installed here by `pixi run setup`; src/ holds the package;
# the JS engine is resolved from a sibling flatppl-js checkout by default, but
# an inherited FLATPPL_JS_DIR wins (e.g. `FLATPPL_JS_DIR=… pixi run …` to point
# at a worktree / alternate engine build) — the default only fills the unset case.
PATH = "$PIXI_PROJECT_ROOT/.pixi-bin/bin:$PATH"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"
FLATPPL_JS_DIR = "${FLATPPL_JS_DIR:-$PIXI_PROJECT_ROOT/../flatppl-js}"

[tasks]
# One-time setup: install the pinned converter binary.
setup = { cmd = "bash scripts/setup.sh" }
# Run the conversion test suite the repo owner drops into tests/.
# `python -m pytest` (not the bare `pytest` console script) is robust when the
# env exposes pytest as a module but not on PATH.
test = "python -m pytest -q"
# Convert one fixture (debugging aid): pixi run convert <hs3.json> <out.flatppl>
convert = ".pixi-bin/bin/flatppl convert --from hs3"
# Full numeric harness over the HS3TestSuite fixtures.
harness = "python -m flatppl_testsuite"
# Run the HS3 corpus and print formatted tables (fixtures 2DeltaNLL + conversions).
hs3 = "python corpora/hs3/run_comparisons.py"
# Render the HS3 scoring results as a Markdown report.
report = "python corpora/hs3/report.py"
# Run the HS3 corpus under the det-js engine (determinize -> score, no
# convert-time measure algebra) and print a model -> PASS/SKIP/MISMATCH table.
gate = "python corpora/hs3/gate.py"
# Regenerate the conversions' frozen ROOT 2DeltaNLL vectors (needs the root env):
#   pixi run -e root python corpora/hs3/conversions/gen_expected.py
gen-conversions = { cmd = "python corpora/hs3/conversions/gen_expected.py" }
# Run the fragment corpus under the det-js engine (determinize -> score, no
# convert-time measure algebra) and print a test_id -> PASS/SKIP/MISMATCH table.
fragment = "python corpora/fragment/gate.py"
# Run the sample corpus under the det-js engine (determinize -> seed-sweep ->
# empirical stats vs closed-form oracle) and print a
# test_id::check -> PASS/SKIP/MISMATCH table.
sample = "python corpora/sample/gate.py"
# Run the bayesian_inference corpus under the det-js engine (determinize ->
# score, no convert-time measure algebra) and print a
# test_id -> PASS/SKIP/MISMATCH table.
bayesian_inference = "python corpora/bayesian_inference/gate.py"

# ---------------------------------------------------------------------------
# Oracle environments. ROOT and pyHS3 have disjoint heavy dependency stacks,
# kept in separate features so the base environment stays light.
# ---------------------------------------------------------------------------
[feature.root.dependencies]
root = ">=6.30"

[feature.pyhs3.pypi-dependencies]
pyhs3 = "*"

# ---------------------------------------------------------------------------
# StableHLO numeric-execution gate. Executes emitted StableHLO with Enzyme-JAX
# (`enzyme_ad.jax.hlo_call`) so the emitted density modules are checked as
# NUMBERS and GRADIENTS, not just structurally. The enzyme 0.0.14 wheel is
# built against a specific (older) jaxlib ABI and its code still calls the
# 1-arg `jax_mlir.aval_to_ir_types(aval)`, so jax/jaxlib are pinned to the era
# that matches (newer jax made it 2-arg and broke the wheel). The wheel is
# CPython 3.12-only, so this feature pins python 3.12 (disjoint from the base
# env's `>=3.11`), which is why it lives in its own environment.
[feature.stablehlo.dependencies]
python = "3.12.*"
# INDEPENDENT oracle (scipy) + numpy; kept <2.1 for the enzyme/jaxlib ABI era.
scipy = ">=1.11"
numpy = "<2.1"

[feature.stablehlo.pypi-dependencies]
# enzyme_ad.jax.hlo_call imports emitted StableHLO (@main) as a jit-able +
# differentiable jax callable — the executor for value AND gradient checks.
# jax/jaxlib are pypi (NOT conda-forge): the enzyme 0.0.14 wheel bundles a
# jaxlib-ABI extension, so jaxlib must be the matching pypi build — a conda
# jaxlib installs a dist-info but no importable package here and breaks import.
# 0.4.36 is the matched era (newer jax made `aval_to_ir_types` 2-arg, breaking
# the wheel). The wheel is CPython 3.12-only, hence the python 3.12 pin above
# (disjoint from the base env's >=3.11), which is why this is its own env.
enzyme-ad = "==0.0.14"
jax = "==0.4.36"
jaxlib = "==0.4.36"
pytest = ">=8"

# The gate task lives on the feature (the `stablehlo` env is no-default-feature,
# so the base `[tasks]` are not in scope). Emit StableHLO from the local
# `flatppl stablehlo` binary, execute under Enzyme-JAX, check value + jax.grad
# gradient vs the scipy oracle, plus @sample distribution and multi-rng
# independence. Point FLATPPL_BIN at a `flatppl` built with the `stablehlo`
# feature (the subcommand is feature-gated):
#   FLATPPL_BIN=/path/to/target/release/flatppl pixi run -e stablehlo shlo
[feature.stablehlo.tasks]
shlo = "python corpora/stablehlo/gate.py"

[environments]
root = ["root"]
pyhs3 = ["pyhs3"]
stablehlo = { features = ["stablehlo"], no-default-feature = true }
