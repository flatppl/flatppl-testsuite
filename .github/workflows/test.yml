name: test

on:
  push:
    branches: [main]
  pull_request:

# Gate the FlatPPL engine against the frozen, ROOT-verified values only. The
# live ROOT/pyHS3 oracle (heavy conda stacks) is never run in CI — FLATPPL_NO_ORACLE
# short-circuits it so the oracle envs are never solved or installed; those tests
# skip. The frozen expected.json vectors were produced by ROOT offline.
env:
  FLATPPL_NO_ORACLE: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          # pixi.lock is intentionally not committed; solve on the fly.
          locked: false
          # Base env (python + node 24 + rust) + the stablehlo gate env
          # (python 3.12 + enzyme-ad/jax pins + scipy). Never the heavy
          # root/pyhs3 oracle environments.
          environments: default stablehlo

      # Cache the cargo registry/git so the converter's dependencies are not
      # re-downloaded each run. The converter binary itself is rebuilt from
      # flatppl-rust@main every run, on purpose — that is what catches converter
      # regressions against the frozen values.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pixi.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install pinned converter + JS engine (no ROOT)
        run: pixi run setup

      - name: Run FlatPPL tests against frozen ROOT-verified values
        run: pixi run test

      # StableHLO numeric-execution gate: the unified per-test-dir suite (one
      # dir per distribution/model under corpora/stablehlo/, each carrying its
      # own model.flatppl/query.flatppl/test.json/test.py). Emits via the
      # setup-built `flatppl stablehlo` verb, executes under Enzyme-JAX, checks
      # value + jax.grad gradient vs each dir's frozen/oracle expectation, plus
      # @sample distribution + multi-rng independence. Separate env (python
      # 3.12 / enzyme pins), so a separate step.
      - name: Run StableHLO numeric-execution gate (Enzyme-JAX)
        run: FLATPPL_BIN="$PWD/.pixi-bin/bin/flatppl" PYTHONPATH="$PWD/src" pixi run -e stablehlo python -m pytest tests/test_unified.py -q

      # Examples corpus under StableHLO: score each flatppl-examples posterior
      # via a `load_module` query module, execute under Enzyme-JAX, compare to
      # the frozen scipy oracle. Needs the flatppl-examples checkout (unlike the
      # in-repo stablehlo corpus above) — clone it blobless and point the gate
      # at it via FLATPPL_EXAMPLES_DIR. Placed AFTER `pixi run test` so that
      # pytest path is unchanged (its det-js examples suite still skips when the
      # checkout is absent at that point).
      - name: Fetch flatppl-examples for the StableHLO examples gate
        run: git clone --filter=blob:none https://github.com/flatppl/flatppl-examples "$HOME/flatppl-examples"

      - name: Run StableHLO examples posterior-scoring gate (Enzyme-JAX)
        run: FLATPPL_BIN="$PWD/.pixi-bin/bin/flatppl" FLATPPL_EXAMPLES_DIR="$HOME/flatppl-examples" PYTHONPATH="$PWD/src" pixi run -e stablehlo examples-shlo
