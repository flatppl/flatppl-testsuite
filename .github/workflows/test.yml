name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          # pixi.lock is intentionally not committed; solve on the fly.
          locked: false
          # Base env (python + node 24 + rust) + the stablehlo gate env
          # (python 3.12 + enzyme-ad/jax pins + scipy). Never the heavy
          # root/pyhs3 oracle environments.
          environments: default stablehlo

      # Cache the cargo registry/git so the converter's dependencies are not
      # re-downloaded each run. The converter binary itself is rebuilt from
      # flatppl-rust@main every run, on purpose — that, and the flatppl-js@main
      # clone setup.sh makes, are what put an upstream regression in front of the
      # frozen values on the merge that introduces it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('pixi.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install converter + JS engine at main (no ROOT)
        run: pixi run setup

      # FLATPPL_REQUIRE_ENGINES makes a missing prerequisite for the named engine
      # FAIL rather than skip. Without it a wrong FLATPPL_BIN or a missing dep
      # degrades every case for that engine to a skip and the step still exits 0,
      # silently deleting the gate this step exists to be.
      - name: Run FlatPPL tests against frozen ROOT-verified values
        run: FLATPPL_REQUIRE_ENGINES=det-js pixi run test

      # Provenance is INFORMATIONAL and this step never fails the run. Both
      # engines are built at main above, so a verdict table pinned behind them is
      # the normal state from the next merge onward — metadata skew, not a
      # number. Blocking on it made every unrelated engine merge red while
      # saying nothing about a value; the verdict comparison in the step above is
      # what has teeth. The annotation says when `pixi run repin` is due.
      - name: Report engine provenance skew (never blocks)
        run: |
          pixi run provenance || echo "::warning title=Engine provenance skew::A frozen verdict table is pinned to an engine commit other than the one built here, so its rows were produced by a different build. The verdict comparison above still passed. Run \`pixi run repin\` to re-freeze both tables against current engines."

      # StableHLO numeric-execution gate: the unified per-test-dir suite (one
      # dir per distribution/model under corpora/stablehlo/, each carrying its
      # own model.flatppl/query.flatppl/test.json/test.py). Emits via the
      # setup-built `flatppl stablehlo` verb, executes under Enzyme-JAX, checks
      # value + jax.grad gradient vs each dir's frozen/oracle expectation, plus
      # @sample distribution + multi-rng independence. Separate env (python
      # 3.12 / enzyme pins), so a separate step.
      - name: Run StableHLO numeric-execution gate (Enzyme-JAX)
        run: FLATPPL_REQUIRE_ENGINES=stablehlo FLATPPL_BIN="$PWD/.pixi-bin/bin/flatppl" PYTHONPATH="$PWD/src" pixi run -e stablehlo unified
